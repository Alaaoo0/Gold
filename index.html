<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة جمع الذهب</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: system-ui, sans-serif;
  }
  .game-container {
    position: relative;
    max-width: 100%;
  }
  canvas {
    display: block;
    background: #16213e;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  .hud {
    position: absolute;
    top: 12px;
    right: 18px;
    color: #fff;
    font-size: 20px;
    text-shadow: 1px 1px 3px #000;
    pointer-events: none;
    background: rgba(0,0,0,0.3);
    padding: 6px 14px;
    border-radius: 20px;
  }
  .hud span {
    color: gold;
    font-weight: bold;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    border-radius: 12px;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .overlay h1 {
    margin: 0 0 12px;
    font-size: 32px;
  }
  .overlay p {
    margin: 6px 0;
    font-size: 18px;
  }
  .overlay button {
    margin-top: 18px;
    padding: 12px 32px;
    font-size: 20px;
    background: gold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #1a1a2e;
    transition: 0.2s;
  }
  .overlay button:hover {
    background: #ffd700;
    transform: scale(1.05);
  }
  .hidden {
    display: none !important;
  }
  .controls {
    position: absolute;
    bottom: 10px;
    left: 14px;
    color: #aaa;
    font-size: 14px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="game-container">
  <canvas id="game" width="800" height="600"></canvas>
  <div class="hud">النقاط: <span id="score">0</span> | الوقت: <span id="time">60</span></div>
  <div id="overlay" class="overlay">
    <h1>💰 لعبة جمع الذهب 💰</h1>
    <p>استخدم الأسهم أو WASD للحركة</p>
    <p>أو المس / انقر للتحرك نحو النقطة</p>
    <button id="startBtn">ابدأ اللعبة</button>
  </div>
  <div class="controls">تحكم: أسهم / WASD / لمس</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const W = canvas.width;
const H = canvas.height;

let player = { x: W/2, y: H/2, r: 20, speed: 5 };
let coins = [];
let score = 0;
let timeLeft = 60;
let gameRunning = false;
let lastTime = 0;
let keys = {};
let touchTarget = null;

// إنشاء عملة جديدة
function spawnCoin() {
  const r = 12;
  const x = Math.random() * (W - r*2) + r;
  const y = Math.random() * (H - r*2) + r;
  coins.push({ x, y, r, value: 1, phase: Math.random() * Math.PI * 2 });
}

// تهيئة العملات
function initCoins(n = 5) {
  coins = [];
  for (let i = 0; i < n; i++) spawnCoin();
}

// إعادة تعيين اللعبة
function resetGame() {
  player.x = W/2;
  player.y = H/2;
  score = 0;
  timeLeft = 60;
  scoreEl.textContent = score;
  timeEl.textContent = Math.floor(timeLeft);
  initCoins(5);
  gameRunning = true;
  touchTarget = null;
  overlay.classList.add('hidden');
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// حلقة اللعبة
function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  
  update(dt);
  draw();
  
  if (gameRunning) requestAnimationFrame(gameLoop);
}

function update(dt) {
  // المؤقت
  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    timeEl.textContent = 0;
    gameOver();
    return;
  }
  timeEl.textContent = Math.floor(timeLeft);

  // حركة اللاعب بالكيبورد
  let dx = 0, dy = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * dt * 60;
    player.y += (dy / len) * player.speed * dt * 60;
    touchTarget = null;
  } else if (touchTarget) {
    const tdx = touchTarget.x - player.x;
    const tdy = touchTarget.y - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist > 2) {
      player.x += (tdx / dist) * player.speed * dt * 60;
      player.y += (tdy / dist) * player.speed * dt * 60;
    } else {
      touchTarget = null;
    }
  }

  // حدود الشاشة
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));

  // التصادم مع العملات
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    const dist = Math.hypot(player.x - c.x, player.y - c.y);
    if (dist < player.r + c.r) {
      score += c.value;
      scoreEl.textContent = score;
      coins.splice(i, 1);
      spawnCoin();
      if (score % 5 === 0) spawnCoin(); // عملة إضافية كل 5 نقاط
    }
  }

  // تحريك العملات
  coins.forEach(c => c.phase += dt * 3);
}

function draw() {
  // خلفية متدرجة
  const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W/2);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#0f0f1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // رسم العملات
  coins.forEach(c => {
    const scale = 1 + Math.sin(c.phase) * 0.1;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(scale, scale);
    
    ctx.shadowColor = 'gold';
    ctx.shadowBlur = 15;
    
    // جسم العملة
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.fill();
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // لمعة
    ctx.beginPath();
    ctx.arc(-c.r * 0.3, -c.r * 0.3, c.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff8dc';
    ctx.fill();
    
    // علامة الدولار
    ctx.fillStyle = '#b8860b';
    ctx.font = `bold ${c.r}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1);
    
    ctx.restore();
  });

  // رسم اللاعب
  ctx.save();
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  const playerGrad = ctx.createRadialGradient(
    player.x - 5, player.y - 5, 5,
    player.x, player.y, player.r
  );
  playerGrad.addColorStop(0, '#7ef9ff');
  playerGrad.addColorStop(1, '#0088cc');
  ctx.fillStyle = playerGrad;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // عيون
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(player.x - 7, player.y - 5, 4, 0, Math.PI * 2);
  ctx.arc(player.x + 7, player.y - 5, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(player.x - 7, player.y - 5, 2, 0, Math.PI * 2);
  ctx.arc(player.x + 7, player.y - 5, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // مؤشر اللمس
  if (touchTarget) {
    ctx.beginPath();
    ctx.arc(touchTarget.x, touchTarget.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function gameOver() {
  gameRunning = false;
  overlay.innerHTML = `
    <h1>انتهى الوقت! ⏰</h1>
    <p>مجموع النقاط: <strong style="color:gold;font-size:28px;">${score}</strong></p>
    <button id="restartBtn">العب مرة أخرى</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('restartBtn').addEventListener('click', resetGame);
}

// التحكم بالكيبورد
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

// التحكم باللمس والماوس
function handlePointer(e) {
  if (!gameRunning) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  touchTarget = {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', handlePointer);
canvas.addEventListener('mousemove', e => { if (e.buttons === 1) handlePointer(e); });
canvas.addEventListener('touchstart', handlePointer, { passive: false });
canvas.addEventListener('touchmove', handlePointer, { passive: false });
canvas.addEventListener('touchend', () => { touchTarget = null; });

startBtn.addEventListener('click', resetGame);
</script>
</body>
</html>
